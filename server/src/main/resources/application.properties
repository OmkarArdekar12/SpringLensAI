#SpringLensAI server configuration
spring.application.name=SpringLensAI
spring.config.import=optional:file:.env[.properties]

#Server
server.port=${PORT:8080}

server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

#PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/springlensai}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.connection-timeout=30000

#JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

#Sessions
spring.session.jdbc.initialize-schema=always

spring.session.jdbc.cleanup-cron=0 0 * * * *
server.servlet.session.timeout=7d
server.servlet.session.cookie.name=SPRINGLENSAI_SESSION
server.servlet.session.cookie.http-only=true

server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

#Gemini (chat)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.temperature=0.2

#Gemini (embeddings)
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

spring.ai.google.genai.embedding.text.dimensions=768

#pgvector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

#GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,repo

spring.security.oauth2.client.registration.github.redirect-uri=${FRONTEND_URL:http://localhost:3000}/login/oauth2/code/github
spring.security.oauth2.client.provider.github.user-name-attribute=id

#App settings
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT}

#Indexing
app.indexing.max-file-bytes=${INDEX_MAX_FILE_BYTES:102400}
app.indexing.max-files=${INDEX_MAX_FILES:400}
app.indexing.chunk-size=${INDEX_CHUNK_SIZE:800}
app.indexing.chunk-overlap=${INDEX_CHUNK_OVERLAP:100}

app.indexing.embed-delay-ms=${INDEX_EMBED_DELAY_MS:250}
app.indexing.embed-max-retries=${INDEX_EMBED_MAX_RETRIES:5}

#GitHub API
app.github.api-delay-ms=${GITHUB_API_DELAY_MS:50}

#Actuator (health checks only)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

#Logging
logging.level.root=INFO
logging.level.com.springlensai=INFO
